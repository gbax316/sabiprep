<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 513 535" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <!-- Authored by hand, not traced: the diagram carries typed labels, which tracing damages.
       Sector boundaries are placed as printed; the original is not drawn to scale
       (e.g. Miscellaneous 5% is drawn wider than 18 degrees), and that is kept.
       Nothing omitted as unreadable. A page smudge outside the circle is not part of the diagram. -->
  <title id="t">Pie chart of household domestic expenditure</title>
  <desc id="d">A pie chart divided into five sectors, each labelled with a name and a percentage printed inside it: "Food 30%", "Education 25%", "House rent 15%", "Miscellaneous 5%", and "Medical 25%". Going clockwise from the top, the sectors appear in the order Medical, Food, Education, House rent, Miscellaneous.</desc>

  <g fill="none" stroke="#E2E8F0" stroke-linecap="round">
    <circle cx="257" cy="277" r="240" stroke-width="5"/>
    <!-- sector boundaries from the centre -->
    <g stroke-width="4.5">
      <line x1="259" y1="277" x2="293" y2="37"/>
      <line x1="259" y1="277" x2="472" y2="381"/>
      <line x1="259" y1="277" x2="208" y2="513"/>
      <line x1="259" y1="277" x2="34" y2="367"/>
      <line x1="259" y1="277" x2="24" y2="212"/>
    </g>
    <!-- angle arcs at the centre, one per sector -->
    <g stroke-width="3">
      <path d="M201.2 261.0 A60 60 0 0 1 267.5 217.6"/>
      <path d="M266.7 222.5 A56 56 0 0 1 308.4 301.1"/>
      <path d="M318.3 305.9 A66 66 0 0 1 245.1 341.5"/>
      <path d="M247.6 329.8 A54 54 0 0 1 208.9 297.1"/>
      <path d="M210.7 296.3 A52 52 0 0 1 208.9 263.1"/>
    </g>
  </g>

  <g fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" dominant-baseline="central">
    <!-- Medical -->
    <text x="143" y="142" font-size="36" transform="rotate(-38 143 142)">Medical</text>
    <text x="206" y="203" font-size="34" transform="rotate(-38 206 203)">25%</text>
    <!-- Food -->
    <text x="380" y="165" font-size="36">Food</text>
    <text x="355" y="236" font-size="34">30%</text>
    <!-- Education -->
    <text x="315" y="372" font-size="34">25%</text>
    <text x="341" y="440" font-size="36" transform="rotate(-32 341 440)">Education</text>
    <!-- House rent -->
    <text x="197" y="348" font-size="32" transform="rotate(5 197 348)">15%</text>
    <text x="168" y="390" font-size="36" transform="rotate(40 168 390)">House</text>
    <text x="138" y="434" font-size="36" transform="rotate(38 138 434)">rent</text>
    <!-- Miscellaneous -->
    <text x="88" y="251" font-size="26" transform="rotate(11 88 251)">Miscell-</text>
    <text x="77" y="282" font-size="26" transform="rotate(10 77 282)">aneous</text>
    <text x="172" y="284" font-size="26" transform="rotate(8 172 284)">5%</text>
  </g>
</svg>
