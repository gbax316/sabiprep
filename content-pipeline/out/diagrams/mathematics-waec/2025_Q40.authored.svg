<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 90 720 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<!-- Authored by hand, not traced: the diagrams in this subject carry typed labels, which tracing damages.
     Coordinates follow the original 2025_Q40.png (800x800). Nothing omitted as unreadable. -->
<title id="t">Circle with centre O and points P, Q, R, S</title>
<desc id="d">A circle with centre O. Four points sit on its edge: Q at the upper left, R at the left, S at the lower left, and P at the right. Lines join Q to R, Q to S, Q to P, and S to P. Further lines join the centre O to Q and to S. At R, the angle between line RQ and line RS is marked (5x)°. At O, the angle between line OQ and line OS is marked (6x + 24)°.</desc>
<g fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
  <circle cx="409" cy="400" r="286"/>
  <!-- chords and radii -->
  <polyline points="206,200 124,403 209,602"/>
  <polyline points="206,200 411,402 209,602"/>
  <polyline points="206,200 695,401 209,602"/>
  <!-- angle arc at R -->
  <path d="M133.3,380.8 A25,25 0 0 1 133.8,426"/>
  <!-- angle arc at O -->
  <path d="M389.6,380.9 A30,30 0 0 0 389.7,423.2"/>
</g>
<g fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="30">
  <text x="180" y="182" text-anchor="middle">Q</text>
  <text x="94" y="410" text-anchor="middle">R</text>
  <text x="194" y="648" text-anchor="middle">S</text>
  <text x="434" y="413" text-anchor="middle">O</text>
  <text x="720" y="410" text-anchor="middle">P</text>
  <text x="162" y="422">(5x)°</text>
  <text transform="translate(335,396) rotate(-90)" text-anchor="middle">(6x + 24)°</text>
</g>
</svg>
