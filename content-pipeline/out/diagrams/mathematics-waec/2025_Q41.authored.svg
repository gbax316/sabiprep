<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 80 600 630" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<!-- Authored by hand, not traced: this subject's diagrams carry typed labels, which automatic tracing damages. Coordinates follow the original 800x800 image. Nothing omitted as unreadable. -->
<title id="t">Circle with chords TR and SQ crossing at P</title>
<desc id="d">A circle with four points on its edge: S at the top, T at the left, R at the right, and Q at the bottom. Two straight lines cross inside the circle: one runs from T to R, the other from S to Q. The centre of the circle, O, is marked close to where these two lines cross, and the crossing point itself is labelled P. A further line joins T to S, and the angle between this line and line TR, at T, is marked 37°. Another line joins R to Q, and the angle between this line and line TR, at R, is marked 59°.</desc>
<g fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
  <circle cx="400" cy="399" r="263"/>
  <!-- chords -->
  <line x1="162" y1="286" x2="636" y2="514"/>
  <line x1="420" y1="138" x2="380" y2="662"/>
  <line x1="162" y1="286" x2="420" y2="138"/>
  <line x1="636" y1="514" x2="380" y2="662"/>
  <!-- angle arcs -->
  <path d="M196.7 266.1 A40 40 0 0 1 198.0 303.3"/>
  <path d="M604.8 532 A36 36 0 0 1 603.6 498.4"/>
  <!-- degree signs -->
  <circle cx="256" cy="269" r="3.5" stroke-width="2"/>
  <circle cx="580" cy="503" r="3.5" stroke-width="2"/>
</g>
<!-- centre / crossing point -->
<circle cx="398" cy="402" r="3.5" fill="#E2E8F0"/>
<g fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="30">
  <text x="419" y="122">S</text>
  <text x="134" y="275">T</text>
  <text x="420" y="392">P</text>
  <text x="365" y="432">O</text>
  <text x="645" y="546">R</text>
  <text x="356" y="698">Q</text>
  <text x="215" y="298">37</text>
  <text x="536" y="530">59</text>
</g>
</svg>
